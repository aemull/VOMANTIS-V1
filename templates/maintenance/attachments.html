<div class="evidence-grid">{% for evidence in attachments %}<figure class="evidence"><a href="{% url 'attachment' evidence.pk %}" target="_blank" rel="noopener">{% if evidence.is_video %}<span class="video-placeholder"><i class="mdi mdi-play-circle-outline"></i> Buka video</span>{% else %}<img loading="lazy" src="{% url 'attachment' evidence.pk %}" alt="{{ evidence.get_stage_display }}: {{ evidence.original_name }}">{% endif %}</a><figcaption>{{ evidence.get_stage_display }}<small>{{ evidence.original_name }}</small></figcaption></figure>{% endfor %}</div>
